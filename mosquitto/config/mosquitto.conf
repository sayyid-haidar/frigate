# Mosquitto configuration for Frigate
# Simple config for local use without authentication

# Listener for MQTT
listener 1883
protocol mqtt

# Listener for WebSocket (optional, for web clients)
listener 9001
protocol websockets

# Allow anonymous connections (for local/trusted network only)
allow_anonymous true

# Persistence
persistence true
persistence_location /mosquitto/data/

# Logging
log_dest file /mosquitto/log/mosquitto.log
log_dest stdout
log_type error
log_type warning
log_type notice
log_type information

# Connection settings
max_keepalive 60
